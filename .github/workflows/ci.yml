name: CI Pipeline - Tests and Coverage

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    # 1. CHECKOUT - Obtener código del repositorio
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    # 2. SETUP JAVA - Configurar entorno Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    # 3. INSTALAR DEPENDENCIAS - Resolver dependencias Maven
    - name: Install dependencies
      run: mvn dependency:go-offline
    
    # 4. EJECUTAR PRUEBAS - Ejecutar todas las pruebas
    - name: Run tests with JUnit
      run: mvn test
    
    # 5. GENERAR REPORTE DE COBERTURA - Ejecutar JaCoCo
    - name: Generate coverage report
      run: mvn verify
    
    # 6. SUBIR REPORTE DE COBERTURA (Opcional)
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: jacoco-report
        path: target/site/jacoco/
        retention-days: 7